# Local development database (alternative to a Supabase dev project).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mba
      POSTGRES_PASSWORD: mba
      POSTGRES_DB: mba
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
